name: Preserve current and release artifacts
on:
  push:
    branches: ['chore/actions-artifact-cleanup-20261026']
    paths: ['.github/workflows/preserve-current-artifacts.yml']
permissions:
  contents: write
  actions: read
env:
  REVIEWED_PLAN: '{"repo":"katana","artifacts":[{"id":12650736776,"name":"SwordMastery-Nexus-Vortex-0.1.0","size":618281,"digest":"sha256:025d3ac2b909204d6689d8de7e2f3f11d94633811f37b787968478fdfdadb8a8","run_id":40324661568,"head_sha":"63d99d9a2d30f6678bb925803712783b7778df3e","created":"2026-10-26T12:43:14Z"},{"id":12649649742,"name":"SwordMastery-Nexus-Vortex-0.1.0","size":618281,"digest":"sha256:16007681fa33e2851f94bce4dd58d3b59351d3e2d21628815ec33dd7765dab97","run_id":40324547245,"head_sha":"63d99d9a2d30f6678bb925803712783b7778df3e","created":"2026-10-26T12:42:22Z"},{"id":12632109719,"name":"SwordMastery-Nexus-Vortex-0.1.0","size":618281,"digest":"sha256:495322a3ed362ec91970d90ef0ca078b7193eb88d6496e11f000ca55ac32cd44","run_id":40281677866,"head_sha":"010536d8f9885f0d986c49cdab1956f0eb96ab65","created":"2026-10-26T06:45:40Z"},{"id":12631547958,"name":"SwordMastery-Nexus-Vortex-0.1.0","size":618281,"digest":"sha256:b3aec0c0b54d91be166137bd5dd0ab55509d3749302bc37f84f9b58f46d09906","run_id":40280792846,"head_sha":"166ac4d29e786abfa380f6b773ed1f8b7c12a9cf","created":"2026-10-26T06:36:31Z"},{"id":11621207095,"name":"SwordMastery-Nexus-Vortex-0.1.0","size":616404,"digest":"sha256:3bde9c8a16c3b2ca1ae24682698fcd4a9dcf9b9ece0a3571626c8f4ea8929f8e","run_id":37940424485,"head_sha":"a54087ef69dcb41e8e689907a3c0c4cc43c58b7f","created":"2026-10-09T13:56:24Z"},{"id":11619140597,"name":"SwordMastery-Nexus-Vortex-0.1.0","size":615184,"digest":"sha256:2e84fd05eaf980237870c66d919c64b45732e205786dda7cf9aa3fe6a575d0af","run_id":37937570418,"head_sha":"1a9e07f7ed30a6678dbd2d2d001215ea33f17556","created":"2026-10-09T13:32:49Z"},{"id":11617619462,"name":"SwordMastery-Install","size":614763,"digest":"sha256:12098ec51868bf5e413c0da236b226347a5af6c8a1f149d5d41ec76c48faf4cd","run_id":37936367267,"head_sha":"61e5964f4ed5dce717076b933ff127b45e80f45a","created":"2026-10-09T13:22:40Z"}]}'
  ARCHIVE_SHARD: 'preservation only'
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const crypto = require('crypto');
            const repo=context.repo, release_id=424245000;
            const plan=JSON.parse(process.env.REVIEWED_PLAN);
            const entries=plan.artifacts;
            const hash=b=>'sha256:'+crypto.createHash('sha256').update(b).digest('hex');
            const bytes=d=>{if(Buffer.isBuffer(d))return d;if(d instanceof ArrayBuffer)return Buffer.from(d);throw new Error('Expected binary data');};
            const release=(await github.rest.repos.getRelease({...repo,release_id})).data;
            if(!release.draft || release.tag_name!=='actions-storage-archive-20261026')throw new Error('Archive draft identity changed');
            const assets=await github.paginate(github.rest.repos.listReleaseAssets,{...repo,release_id,per_page:100});
            const verified=[];
            for(const e of entries){
              const name='artifact-'+e.id+'.zip';
              let asset=assets.find(a=>a.name===name);
              if(!asset){
                const a=(await github.rest.actions.getArtifact({...repo,artifact_id:e.id})).data;
                if(a.expired||a.digest!==e.digest||a.name!==e.name||a.size_in_bytes!==e.size||a.workflow_run.id!==e.run_id||a.workflow_run.head_sha!==e.head_sha)throw new Error('Artifact changed: '+e.id);
                const data=bytes((await github.rest.actions.downloadArtifact({...repo,artifact_id:e.id,archive_format:'zip'})).data);
                if(data.length!==e.size||hash(data)!==e.digest)throw new Error('Source checksum mismatch: '+e.id);
                asset=(await github.rest.repos.uploadReleaseAsset({...repo,release_id,name,label:e.name+' | '+e.digest,data,headers:{'content-type':'application/zip','content-length':data.length}})).data;
              }
              if(asset.state!=='uploaded'||asset.size!==e.size||asset.digest!==e.digest)throw new Error('Backup metadata mismatch: '+e.id);
              const data=bytes((await github.rest.repos.getReleaseAsset({...repo,asset_id:asset.id,headers:{accept:'application/octet-stream'}})).data);
              if(data.length!==e.size||hash(data)!==e.digest)throw new Error('Downloaded backup checksum mismatch: '+e.id);
              const record={...e,release_id,asset_id:asset.id,asset_name:name,verified_sha256:hash(data)};
              verified.push(record);
              console.log('STORAGE_BACKUP '+JSON.stringify(record));
            }
            core.setOutput('verified',JSON.stringify(verified));
            await core.summary.addHeading('Backup only: shard '+process.env.ARCHIVE_SHARD).addRaw(verified.length+' immutable Release assets downloaded and SHA-256 verified. This job has no Actions delete permission.').write();
